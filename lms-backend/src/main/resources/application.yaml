spring:
  application:
    name: lms-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:lms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Anhlinh2005@}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:900000} # 15 phút (Access Token)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 ngày (Refresh Token)

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  data:
    seed:
      enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  platform:
    commission-rate: ${PLATFORM_COMMISSION_RATE:0.20}
  payment:
    vietqr:
      # Tài khoản demo chính thức trong tài liệu VietQR - Napas hợp lệ, chỉ dùng hiển thị
      bank-bin: ${VIETQR_BANK_BIN:970415}
      account-no: ${VIETQR_ACCOUNT_NO:113366668888}
      account-name: ${VIETQR_ACCOUNT_NAME:QUY VAC XIN PHONG CHONG COVID}
      template: ${VIETQR_TEMPLATE:compact2}